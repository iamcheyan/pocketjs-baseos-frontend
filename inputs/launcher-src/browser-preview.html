<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PJOS Linux 掌机启动器预览</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121821;--line:#29333c;--fg:#e8edf2;--muted:#87939e;--mint:#8de8c3;--gold:#f5a524;--shell:#252a30}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#11151a;color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:grid;place-items:center;padding:24px}.layout{width:min(100%,1120px);display:grid;grid-template-columns:fit-content(720px) 224px;gap:28px;align-items:center}.device{background:linear-gradient(145deg,#2a3037,#1d2228);border:1px solid #444c54;border-radius:30px;padding:25px 27px 17px;box-shadow:0 26px 80px #0009,inset 0 1px #ffffff18}.screen{width:720px;height:480px;flex:none;position:relative;overflow:hidden;background:var(--bg);border:5px solid #07080a;border-radius:10px;padding:30px 43px 20px;display:grid;grid-template-rows:77px 1fr 38px 22px;gap:0;box-shadow:0 0 0 1px #50575d}.screen.light{--bg:#dfe6e8;--panel:#eef2f1;--line:#bdc8c7;--fg:#172220;--muted:#64716f;--mint:#177a5b;--gold:#9e6500}.top{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{font-size:35px;line-height:1;font-weight:850;letter-spacing:.035em;color:var(--mint)}.section{font-size:20px;line-height:1.25;font-weight:700;margin-top:6px}.device-info{font:12px ui-monospace,monospace;color:var(--muted);padding-bottom:2px}.list{display:flex;flex-direction:column;gap:4px;padding-top:12px;overflow:hidden}.row{height:35px;flex:none;display:flex;align-items:center;border:1px solid transparent;padding:0 11px;font-size:16px;white-space:nowrap}.row.active{color:var(--mint);border-color:#335949;background:#11251e;font-weight:700}.light .row.active{background:#d0e6dc;border-color:#8eb7a3}.pointer{display:inline-block;width:23px;color:var(--gold);font-family:ui-monospace,monospace}.switch{margin-left:auto;color:var(--muted);font:12px ui-monospace,monospace}.switch.on{color:var(--mint)}.status{display:flex;align-items:center;border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hints{display:flex;align-items:center;gap:21px;color:var(--muted);font:10px ui-monospace,monospace;white-space:nowrap}.key{width:17px;height:17px;border:1px solid #58636b;color:var(--fg);border-radius:50%;display:inline-grid;place-items:center;margin-right:5px;font:10px ui-monospace,monospace}.bezel{height:25px;display:flex;align-items:end;justify-content:space-between;color:#899198;font:9px ui-monospace,monospace;letter-spacing:.18em}.controls{display:flex;flex-direction:column;gap:10px}.controls h1{font-size:15px;margin:0}.controls p{font-size:12px;color:#a2acb4;line-height:1.55;margin:0 0 3px}.controls button{height:39px;text-align:left;border-radius:7px;border:1px solid #3a444d;background:#1b2128;color:#e8edf2;padding:0 11px;font:12px system-ui,sans-serif}.controls button:hover,.controls button:focus-visible{border-color:var(--mint);outline:0}.controls kbd{display:inline-block;min-width:62px;color:var(--mint);font:11px ui-monospace,monospace}.dpad{align-self:center;display:grid;grid-template-columns:38px 38px 38px;grid-template-rows:38px 38px 38px;gap:3px;margin-top:5px}.dpad button{height:38px;padding:0;text-align:center;display:grid;place-items:center;font-size:16px}.void{visibility:hidden}.hint{font-size:10px;color:#849099;text-align:center;margin-top:3px}@media(max-width:1050px){body{place-items:start center;padding:12px}.layout{grid-template-columns:minmax(0,1fr);justify-items:center;gap:14px}.device{max-width:100%;overflow:auto;padding:12px;border-radius:20px}.controls{width:min(100%,720px);display:grid;grid-template-columns:1fr 1fr}.controls h1,.controls p{grid-column:1/-1}.controls .dpad{grid-column:1/-1}}
</style>
</head>
<body>
<main class="layout">
<section class="device" aria-label="RG34XX 屏幕模拟">
<div class="screen" id="screen">
<header class="top"><div><div class="brand">PJOS Linux</div><div class="section" id="section"></div></div><div class="device-info">H700&nbsp; · &nbsp;18:42</div></header>
<div class="list" id="list"></div><div class="status" id="status"></div>
<footer class="hints"><span><b class="key">A</b>打开</span><span><b class="key">B</b>返回</span><span><b class="key">L/R</b>切换</span><span><b class="key">↑↓</b>选择</span></footer>
</div><div class="bezel"><span>ANBERNIC</span><span>RG34XX</span></div>
</section>
<aside class="controls"><h1>掌机启动器预览</h1><p>模拟画布固定为 <b>720 × 480</b>。下面的项目和服务均为演示数据，点击不会操作任何设备。</p>
<button id="prev"><kbd>← / L</kbd>上一栏</button><button id="next"><kbd>→ / R</kbd>下一栏</button><button id="activate"><kbd>Enter / A</kbd>打开或切换</button><button id="back"><kbd>Esc / B</kbd>返回应用</button><button id="theme"><kbd>T</kbd>切换明暗主题</button>
<div class="dpad"><span class="void"></span><button data-d="-1">↑</button><span class="void"></span><button id="left">←</button><span class="void"></span><button id="right">→</button><span class="void"></span><button data-d="1">↓</button><span class="void"></span></div><div class="hint">也可用键盘方向键、Enter、Esc、T 操作</div></aside>
</main>
<script>
const apps=[["文件管理器","disk"],["终端","terminal"],["XMPlayer","xmplayer"],["系统信息","system-info"],["存储信息","storage-info"],["网络信息","network-info"],["USB 设备","usb-info"],["输入设备","input-info"],["系统日志","system-log"],["内核日志","kernel-log"],["系统监视器","monitor"],["进程管理器","processes"],["音频混音器","audio-mixer"],["文件管理","file-manager-text"],["文本编辑器","notes"],["清理 macOS 文件","clean-mac-files"],["云备份","cloud-backup"],["云恢复","cloud-restore"],["手柄测试","gamepad"]];
const serviceNames=["adbd","avahi","ftp","http","rsyncd","samba","syncthing","telnet","ssh"];const pages=["应用","服务","设置"];let page=0,selected=0,theme="dark",message="↑↓ 选择　A 打开　B 返回　L/R 切换";const enabled=new Set(["adbd","ssh"]);const $=s=>document.querySelector(s);
function entries(){return page===0?apps:page===1?serviceNames.map(x=>[x.toUpperCase(),x]):[["主题："+(theme==="dark"?"深色":"浅色"),"theme"],["显示测试","display-test"]]}
function draw(){let a=entries();selected=Math.max(0,Math.min(selected,a.length-1));let top=Math.max(0,Math.min(selected-3,a.length-7));$("#screen").classList.toggle("light",theme==="light");$("#section").textContent=pages[page];$("#list").innerHTML=a.slice(top,top+7).map((x,i)=>{let n=top+i,active=n===selected;return `<div class="row ${active?"active":""}"><span class="pointer">${active?"▶":""}</span>${x[0]}${page===1?`<span class="switch ${enabled.has(x[1])?"on":""}">${enabled.has(x[1])?"开启":"关闭"}</span>`:""}</div>`}).join("");$("#status").textContent=message}
function move(d){selected=Math.max(0,Math.min(entries().length-1,selected+d));draw()}function tab(d){page=(page+d+pages.length)%pages.length;selected=0;message="应用、服务与设置（演示）";draw()}function go(){let [label,id]=entries()[selected]||["",""];if(page===1){enabled.has(id)?enabled.delete(id):enabled.add(id);message=`演示：${id} ${enabled.has(id)?"已开启":"已关闭"}`}else if(id==="theme"){theme=theme==="dark"?"light":"dark";message=`预览主题：${theme==="dark"?"深色":"浅色"}`}else message=`演示选择：${label}`;draw()}function back(){page=0;selected=0;message="应用列表";draw()}
$("#prev").onclick=()=>tab(-1);$("#next").onclick=()=>tab(1);$("#left").onclick=()=>tab(-1);$("#right").onclick=()=>tab(1);$("#activate").onclick=go;$("#back").onclick=back;$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";message=`预览主题：${theme==="dark"?"深色":"浅色"}`;draw()};document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>move(+b.dataset.d));document.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Escape"," "].includes(e.key))e.preventDefault();if(e.key==="ArrowUp")move(-1);else if(e.key==="ArrowDown")move(1);else if(e.key==="ArrowLeft")tab(-1);else if(e.key==="ArrowRight")tab(1);else if(e.key==="Enter"||e.key===" ")go();else if(e.key==="Escape")back();else if(e.key.toLowerCase()==="t"){theme=theme==="dark"?"light":"dark";message=`预览主题：${theme==="dark"?"深色":"浅色"}`;draw()}});draw();
</script>
</body>
</html>
